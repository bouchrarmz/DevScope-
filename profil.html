    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body>
        <body class="bg-gradient-to-r from-slate-950 to-mauve-800 ">
    <header class="flex justify-between p-6  border-slate-700 rounded-xl bg-slate-800 m-10 text-olive-50  sticky top-0" >
        <h1><span class="text-cyan-400">●</span>DevScope</h1>
        <div class="flex  gap-5">
            <a href="index.html" class="text-cyan-400">Recherche</a>
            <a href="shortlist.html" >Shortlist</a>
        </div>
    </header>
    
    <main>
        <form class="flex items-center gap-3 bg-gray-900 p-3 rounded-xl max-w-2xl mx-auto mt-12">

            <input
                type="text"
                placeholder="Entrez un nom d'utilisateur..."
                class="flex-1 bg-transparent p-3 outline-none text-slate-500"
            >
            <button class="bg-cyan-400 to-fuchsia-500 hover:bg-purple-500 p-3 rounded-lg font-bold">
               <a href="profil.html">Recherche </a>
            </button>
        </form>
             <div class="grid grid-cols-1 md:grid-cols-3 gap-7">

            <section class="bg-[#111827] border border-gray-800 rounded-2xl p-7 text-center">

                <img
                    id="avatar"
                    src=""
                    class="w-32 h-32 rounded-full mx-auto border-4 border-cyan-400 mb-6 object-cover"
                >

                <h2 id="nameb" class="text-2xl font-bold"></h2>

                <p id="username" class="text-cyan-400 mt-2"></p>

                <p id="bio" class="text-gray-300 mt-5"></p>

                <div class="bg-[#1b2232] rounded-xl p-4 mt-6 text-left text-gray-300 space-y-2">

                    <p id="location"></p>

                    <p id="createdAt"></p>

                </div>

                <!-- Statistics -->
                <div class="grid grid-cols-3 gap-2 mt-5">

                    <div class="bg-[#1b2232] rounded-xl p-3">
                        <h3 id="reposCount" class="text-xl text-cyan-400 font-bold"></h3>
                        <p class="text-xs text-gray-400">Dépôts</p>
                    </div>

                    <div class="bg-[#1b2232] rounded-xl p-3">
                        <h3 id="followers" class="text-xl text-pink-400 font-bold"></h3>
                        <p class="text-xs text-gray-400">Abonnés</p>
                    </div>

                    <div class="bg-[#1b2232] rounded-xl p-3">
                        <h3 id="following" class="text-xl text-purple-400 font-bold"></h3>
                        <p class="text-xs text-gray-400">Abonnements</p>
                    </div>

                </div>

                <button id="addShortlist"
                    class="w-full mt-6 py-4 rounded-xl font-bold bg-gradient-to-r from-cyan-400 to-pink-500">
                    ★ Ajouter à la shortlist
                </button>

                <a id="profileLink"
                    href="#"
                    target="_blank"
                    class="block border border-gray-700 rounded-xl mt-5 p-3 text-cyan-400">
                    Voir le profil original ↗
                </a>

            </section>

          
            <section class="md:col-span-2 bg-[#111827] border border-gray-800 rounded-2xl p-6">

                <div class="flex items-center gap-4 mb-7">

                    <h2 class="text-2xl font-bold">Dépôts</h2>

                    <span id="reposTotal"
                        class="bg-cyan-950 text-cyan-400 px-3 py-1 rounded-full text-sm">
                        0
                    </span>

                </div>

               
                <div id="repositories"
                    class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                     <template id="repoTemplate">

        <div class="repo-card bg-[#1b2232] border border-gray-700 rounded-2xl p-5 hover:border-cyan-500">

            <h3 class="repo-name text-lg font-bold text-cyan-400"></h3>

            <p class="repo-description text-gray-400 mt-4"></p>

            <div class="flex gap-4 mt-5 text-sm text-gray-300">

                <span class="repo-language"></span>

                <span class="repo-stars"></span>

                <span class="repo-forks"></span>

            </div>

            <a class="repo-link block mt-5 text-cyan-400"
               target="_blank">
                Voir le repository ↗
            </a>

        </div>

    </template>

                </div>

            </section>

        </div>

    </main>

    </body>
    </html>
